[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln"
dynamic = ["version"]
description = "A cheap, always-on tick-server hosting living text agents — needs-driven, two-brain (Haiku/Opus) routing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ichland" }]
dependencies = [
    # Потрібен ЛИШЕ живій гілці чату (chat_reply -> Anthropic Messages API).
    # Dry-run і гілка роздумів (через `claude` CLI) — на самій стандартній бібліотеці.
    "anthropic>=0.111",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Ruff закріплено в межах мінора: формат детермінований, `ruff format --check` у CI стабільний.
    "ruff>=0.15,<0.16",
]

[project.scripts]
kiln = "kiln.__main__:main"

[tool.setuptools]
# kiln — двіжок (ядро); tui — тонкий клієнт Textual (без логіки агента).
packages = ["kiln", "tui"]

# Версія — єдиним джерелом правди тримаємо кореневий файл VERSION
# (його ж читає kiln.__version__ і оновлює /release-version).
[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Модель за seam'ом мокається — у тестах ЖОДНИХ платних викликів.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W (pycodestyle), F (pyflakes), I (isort), UP (pyupgrade), B (bugbear).
select = ["E", "W", "F", "I", "UP", "B"]
# Коментарі, рядки й маркери потреб — українською; службові "приватні" хелпери
# (_c, _usage_tokens, _cli_error_detail) свідомо діляться між модулями.

[tool.ruff.format]
# Стиль ruff за замовчанням (подвійні лапки, пробіли).

[tool.mypy]
# Необов'язково: типи на seam'ах. М'який режим — лишаємо як підказку, не гейт.
python_version = "3.10"
ignore_missing_imports = true
files = ["kiln"]
