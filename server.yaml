# kiln tick-server — server config (committed). Read by serve.sh / connect.sh and exposed in
# config.py as SERVER_HOST / SERVER_PORT / SERVER_AGENT / SERVER_AGENTS. Environment overrides:
# KILN_HOST / KILN_PORT / KILN_AGENT / KILN_AGENTS (comma-separated).

host: 127.0.0.1        # bind address (0.0.0.0 exposes it on the LAN — there's no auth in v1.x)
port: 8000             # HTTP / WebSocket port
agent: agnika          # connect.sh's default attach target
agents: [agnika, pashu]  # v1.2: the agents the server boots, each on its own thread + isolated state
