name: CI

# Лінт + тести на кожен push і PR. Модель за seam'ом мокається — у CI ЖОДНИХ
# платних викликів (ANTHROPIC_API_KEY свідомо не задаємо, тести йдуть на MockBrain).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev + tui)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tui]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest (mock brain — zero paid calls, no ANTHROPIC_API_KEY)
        run: pytest -q

      - name: Dry-run smoke (python -m kiln)
        run: python -m kiln
